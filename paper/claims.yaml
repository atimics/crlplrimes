  "claim_families": [
    {
      "id": "A",
      "title": "The Gated Loop — enumerate, gate, rank, verify",
      "role": "architecture_axis",
      "description": "At decision time: enumerate candidates, eliminate with certified symbolic gates, rank survivors with neural nets, verify the top choice. The neural component ranks; the symbolic component certifies."
    },
    {
      "id": "C",
      "title": "The Feedback Loops — rejected candidates, hypothesis library, self-play",
      "role": "architecture_axis",
      "description": "Failed proposals become training data. Successful rules accumulate in the hypothesis library and feed back into proposal ranking. Verified self-play generates new training instances. The system improves without the model owning correctness."
    },
    {
      "id": "D",
      "title": "The Evidence Contract — claim compiler, trace determinism, dataset engine",
      "role": "framework_claim",
      "description": "Every paper assertion is mechanically checked against trace artifacts. Float/double runs produce identical semantic traces. The dataset-first engine exposes shared candidate/verifier/evidence contracts across domains."
    },
    {
      "id": "E",
      "title": "Domain Instances — the architecture applied to specific tasks",
      "role": "evidence_surface",
      "description": "The gated-ranking loop and certified-gate framework instantiated on prime gap prediction, ARC visual reasoning, delayed-claim temporal reasoning, grid-path navigation, cross-domain transfer, and Signal flight control."
    }
  ],

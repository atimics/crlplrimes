name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pin runner OS and toolchain. Drift from these pins should be a deliberate
# decision, not a silent latest-image bump.
env:
  CC: gcc-13
  REAL: float
  TYPST_VERSION: "0.14.2"

jobs:
  unit-and-sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pin toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-13 make libopenblas-dev
          ${CC} --version

      - name: Capture environment manifest
        run: |
          printf '{"schema":"crlp.environment_manifest.v1","cc":"%s","real":"%s"}\n' "$CC" "$REAL" > environment.json

      - name: Build promoted binaries
        run: make -j$(nproc) promoted NN_BLAS=openblas

      - name: Run unit + sanitizer + trace determinism + numeric certificate gates
        run: make check NN_BLAS=openblas

      - name: Smoke-run experimental sandboxes
        run: make experimental-check NN_BLAS=openblas

      - name: Upload environment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ github.run_id }}
          path: environment.json
          if-no-files-found: error
          retention-days: 30

  build-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install typst
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Build paper
        run: typst compile paper/paper.typ paper/paper.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ github.run_id }}
          path: paper/paper.pdf
          if-no-files-found: error
          retention-days: 30

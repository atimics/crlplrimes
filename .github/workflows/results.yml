name: results

# Stable-baseline run. Captures comparison.jsonl, environment manifest, and
# opens a PR if the canonical (timing-stripped) results diff from main. The
# same run publishes the latest results and generated model checkpoints to
# GitHub Pages when it runs on main.
#
# Not triggered on every push. Use:
#   - workflow_dispatch: manual rerun.
#   - schedule: nightly cron, so drift gets surfaced even without a code change.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"  # 07:23 UTC daily

env:
  CC: gcc-13
  REAL: double

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Pin toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-13 make libopenblas-dev
          ${CC} --version

      - name: Build promoted binaries
        run: make -j$(nproc) promoted NN_BLAS=openblas

      - name: Run make results
        run: make results NN_BLAS=openblas

      - name: Capture environment manifest
        run: |
          mkdir -p results/latest
          node <<'NODE'
          const fs = require("fs");
          const os = require("os");
          const cp = require("child_process");

          function sh(command) {
            try {
              return cp.execSync(command, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }).trim();
            } catch {
              return "";
            }
          }

          const manifest = {
            schema: "crlp.environment_manifest.v1",
            schema_version: 2,
            real: process.env.REAL || "",
            cc: process.env.CC || "",
            compiler_version: sh(`${process.env.CC || "cc"} --version`).split(/\r?\n/)[0] || "",
            make_version: sh("make --version").split(/\r?\n/)[0] || "",
            libc: sh("ldd --version 2>&1").split(/\r?\n/)[0] || "",
            openblas_version: sh("pkg-config --modversion openblas 2>/dev/null") || "",
            runner_os: process.env.RUNNER_OS || os.platform(),
            runner_arch: process.env.RUNNER_ARCH || os.arch(),
            uname: sh("uname -a"),
            cpu_model: sh("awk -F: '/model name/{sub(/^ /, \"\", $2); print $2; exit}' /proc/cpuinfo"),
            cpu_count: os.cpus().length,
            github_repository: process.env.GITHUB_REPOSITORY || "",
            github_sha: process.env.GITHUB_SHA || "",
            github_run_id: process.env.GITHUB_RUN_ID || "",
            github_workflow: process.env.GITHUB_WORKFLOW || "",
            captured_utc: new Date().toISOString().replace(/\.\d{3}Z$/, "Z")
          };

          fs.writeFileSync("results/latest/environment.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE

      - name: Diff canonical results against main
        id: diff
        run: |
          git fetch origin main --depth=1
          if git diff --exit-code origin/main -- results/latest/comparison.canonical.jsonl \
                results/latest/summary.md results/latest/commands.txt; then
            echo "results_changed=false" >> "$GITHUB_OUTPUT"
            echo "Canonical results unchanged."
          else
            echo "results_changed=true"  >> "$GITHUB_OUTPUT"
            echo "Canonical results differ from main."
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: |
            results/latest/
          retention-days: 90

      - name: Build GitHub Pages site
        if: github.ref == 'refs/heads/main'
        run: sh scripts/build_pages_site.sh

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-site

      - name: Open results-update PR
        if: steps.diff.outputs.results_changed == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/results-${{ github.run_id }}
          base: main
          title: "ci(results): captured run ${{ github.run_id }}"
          body: |
            Automated capture of `make results` from the pinned `ubuntu-24.04` /
            `gcc-13` runner. The canonical (timing-stripped) comparison rows
            differ from `main`; open this PR to review and merge if the change
            is expected. The full `comparison.jsonl`, including runner-dependent
            timing fields, is uploaded as a run artifact for inspection.

            - run id: `${{ github.run_id }}`
            - runner: `ubuntu-24.04`
            - compiler: `${{ env.CC }}`
            - REAL: `${{ env.REAL }}`
          commit-message: "ci(results): captured run ${{ github.run_id }}"
          add-paths: |
            results/latest/comparison.jsonl
            results/latest/comparison.canonical.jsonl
            results/latest/summary.md
            results/latest/commands.txt
            results/latest/environment.json

  publish-pages:
    if: github.ref == 'refs/heads/main'
    needs: capture
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
